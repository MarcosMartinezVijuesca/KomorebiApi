openapi: 3.0.1
info:
  title: Komorebi API
  description: |
    API for managing schools and projects linked to the UN 2030 Agenda (ODS).
    
    ## Authentication
    This API uses JWT Bearer tokens. To access protected endpoints:
    1. Register a user via `POST /auth/register`
    2. Login via `POST /auth/login` to get a token
    3. Include the token in the `Authorization` header: `Bearer <token>`
    
    ## Access Control
    - **Public**: GET operations on schools and projects
    - **ADMIN role required**: POST, PUT, DELETE operations
  version: 1.0.0
servers:
  - url: 'http://localhost:8081'
    description: Local development server
  - url: 'http://komorebi.es'
    description: Production server

tags:
  - name: auth
    description: Authentication operations
  - name: schools
    description: Operations with schools
  - name: projects
    description: Operations with projects

paths:
  # --- AUTH ---
  /auth/register:
    post:
      tags:
        - auth
      summary: Register a new user
      description: Creates a new user account. Returns a JWT token on success.
      requestBody:
        description: User registration data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '400':
          description: Bad Request (Validation Error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '409':
          description: Conflict - Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  /auth/login:
    post:
      tags:
        - auth
      summary: Login
      description: Authenticates a user and returns a JWT token.
      requestBody:
        description: Login credentials
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '400':
          description: Bad Request (Validation Error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Unauthorized - Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  # --- SCHOOLS ---
  /schools:
    get:
      tags:
        - schools
      summary: Returns a list of schools
      description: |
        Returns a list of all available schools.
        Allows filtering by name and city.
      parameters:
        - name: name
          in: query
          description: Filter by school name
          required: false
          schema:
            type: string
        - name: city
          in: query
          description: Filter by city
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchoolOutDto'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    post:
      tags:
        - schools
      summary: Register a new school
      description: Creates a new school in the database. Requires ADMIN role.
      security:
        - bearerAuth: []
      requestBody:
        description: School data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolInDto'
      responses:
        '201':
          description: School created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolOutDto'
        '400':
          description: Bad Request (Validation Error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Unauthorized - Token missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Forbidden - ADMIN role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  /schools/{id}:
    parameters:
      - name: id
        in: path
        description: School identifier
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - schools
      summary: Get school by ID
      description: Returns a specific school by its ID.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolOutDto'
        '404':
          description: School Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    put:
      tags:
        - schools
      summary: Modify school
      description: Updates an existing school. Requires ADMIN role.
      security:
        - bearerAuth: []
      requestBody:
        description: Updated school data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolInDto'
      responses:
        '200':
          description: School modified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolOutDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Forbidden - ADMIN role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: School Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    delete:
      tags:
        - schools
      summary: Delete school
      description: Removes a school from the database. Requires ADMIN role.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: School deleted successfully (No Content)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Forbidden - ADMIN role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: School Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  /schools/{schoolId}/projects:
    parameters:
      - name: schoolId
        in: path
        description: School identifier
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags:
        - projects
      summary: Register a new project for a school
      description: Creates a new project and assigns it to the specified school. Requires ADMIN role.
      security:
        - bearerAuth: []
      requestBody:
        description: Project data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInDto'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOutDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Forbidden - ADMIN role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: School Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  # --- PROJECTS ---
  /projects:
    get:
      tags:
        - projects
      summary: Returns a list of projects
      description: |
        Returns a list of all projects.
        Allows filtering by name and description.
      parameters:
        - name: name
          in: query
          description: Filter by project name
          required: false
          schema:
            type: string
        - name: description
          in: query
          description: Filter by description
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectOutDto'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  /projects/{id}:
    parameters:
      - name: id
        in: path
        description: Project identifier
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - projects
      summary: Get project by ID
      description: Returns a specific project.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOutDto'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    put:
      tags:
        - projects
      summary: Modify project
      description: Updates an existing project. Requires ADMIN role.
      security:
        - bearerAuth: []
      requestBody:
        description: Updated project data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInDto'
      responses:
        '200':
          description: Project modified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOutDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Forbidden - ADMIN role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
    delete:
      tags:
        - projects
      summary: Delete project
      description: Removes a project from the database. Requires ADMIN role.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Project deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Forbidden - ADMIN role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login

  schemas:
    # --- AUTH ---
    RegisterDto:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Unique username
        password:
          type: string
          description: Password
          format: password
        role:
          type: string
          description: User role (ADMIN or USER). Defaults to USER if not provided.
          enum:
            - ADMIN
            - USER
      example:
        username: admin
        password: admin123
        role: ADMIN

    LoginDto:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Username
        password:
          type: string
          description: Password
          format: password
      example:
        username: admin
        password: admin123

    AuthResponseDto:
      type: object
      properties:
        token:
          type: string
          description: JWT token
        username:
          type: string
          description: Username
        role:
          type: string
          description: User role
      example:
        token: eyJhbGciOiJIUzI1NiJ9...
        username: admin
        role: ROLE_ADMIN

    # --- SCHOOLS ---
    SchoolInDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the school
        city:
          type: string
          description: City
        students:
          type: integer
          format: int64
          description: Number of students
          minimum: 1
        publicSchool:
          type: boolean
          description: Is public school
        registerDate:
          type: string
          format: date
          description: Registration date
      example:
        name: IES Valle del Jerte
        city: Plasencia
        students: 500
        publicSchool: true
        registerDate: 2023-09-01

    SchoolOutDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: School identifier
        name:
          type: string
          description: Name of the school
        city:
          type: string
          description: City
        students:
          type: integer
          format: int64
          description: Number of students
        publicSchool:
          type: boolean
          description: Is public school
        registerDate:
          type: string
          format: date
          description: Registration date
      example:
        id: 10
        name: IES Valle del Jerte
        city: Plasencia
        students: 500
        publicSchool: true
        registerDate: 2023-09-01

    # --- PROJECTS ---
    ProjectInDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the project
        description:
          type: string
          description: Description
        ods:
          type: integer
          description: ODS identifier
          minimum: 1
        active:
          type: boolean
          description: Is the project active
        startDate:
          type: string
          format: date
          description: Start date
      example:
        name: Science Fair 2025
        description: Innovación tecnológica
        ods: 4
        active: true
        startDate: 2025-01-10

    ProjectOutDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Project identifier
        name:
          type: string
          description: Name of the project
        description:
          type: string
          description: Description
        ods:
          type: integer
          description: ODS identifier
        active:
          type: boolean
          description: Is the project active
        startDate:
          type: string
          format: date
          description: Start date
        schoolId:
          type: integer
          format: int64
          description: ID of the associated school
      example:
        id: 55
        name: Science Fair 2025
        description: Innovación tecnológica
        ods: 4
        active: true
        startDate: 2025-01-10
        schoolId: 10

    # --- ERRORS ---
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Error message
        errorMessages:
          type: object
          additionalProperties:
            type: string
          description: Field validation errors

    InternalServerError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      example:
        code: 500
        message: Internal Server Error

    BadRequest:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      example:
        code: 400
        message: Bad Request
        errorMessages:
          name: name is mandatory and cannot be empty
          students: must be greater than or equal to 1

    NotFound:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      example:
        code: 404
        message: Resource Not Found

    Unauthorized:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      example:
        code: 401
        message: Invalid username or password

    Conflict:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      example:
        code: 409
        message: Username already exists

    Forbidden:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
      example:
        code: 403
        message: Access Denied