name: Hoppscotch API Tests

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  api-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 25092010
          MYSQL_DATABASE: komorebidb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and start API
        run: ./mvnw spring-boot:run &
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/komorebidb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: 25092010
          JWT_SECRET: komorebi-super-secret-key-2025-svalero-dam
          JWT_EXPIRATION: 86400000

      - name: Wait for API to start
        run: |
          echo "Waiting for API..."
          for i in {1..30}; do
            curl -s http://localhost:8081/schools && break
            sleep 3
          done

      - name: Install Hopp CLI
        run: npm install -g @hoppscotch/cli

      - name: Run Hoppscotch tests
        run: hopp test hoppscotch-collection.json --env-file hoppscotch-env.json