name: Hoppscotch API Tests

on:
  pull_request:
    branches:
      - master
      - develop

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Give mvnw execute permission
        run: chmod +x mvnw

      - name: Build API
        run: ./mvnw package -DskipTests
        env:
          SPRING_CONFIG_IMPORT: "optional:"
      - name: Start API
        run: |
          java \
            -DSPRING_PROFILES_ACTIVE=dev \
            -DSPRING_CONFIG_IMPORT=optional: \
            -DSPRING_DATASOURCE_URL=jdbc:h2:mem:komorebidb \
            -DSPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver \
            -DSPRING_DATASOURCE_USERNAME=sa \
            -DSPRING_DATASOURCE_PASSWORD= \
            -DSPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.H2Dialect \
            -DSPRING_JPA_HIBERNATE_DDL_AUTO=create-drop \
            -DJWT_SECRET=komorebi-super-secret-key-2025-svalero-dam \
            -DJWT_EXPIRATION=86400000 \
            -jar target/komorebiApi-0.0.1-SNAPSHOT.jar &
      

      - name: Wait for API to start
        run: |
          echo "Waiting for API..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/schools || echo "000")
            echo "Attempt $i - Status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "API is up!"
              exit 0
            fi
            sleep 5
          done
          echo "API did not start in time"
          exit 1

      - name: Create admin user and get token
        run: |
          curl -s -X POST http://localhost:8081/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"admin123","role":"ADMIN"}'

          TOKEN=$(curl -s -X POST http://localhost:8081/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"admin123"}' | grep -o '"token":"[^"]*"' | cut -d'"' -f4)

          echo "Token: $TOKEN"
          sed -i 's/"key": "token", "value": ""/"key": "token", "value": "'"$TOKEN"'"/' hoppscotch-env.json
          cat hoppscotch-env.json

      - name: Install Hopp CLI
        run: npm install -g @hoppscotch/cli

      - name: Run Hoppscotch tests
        run: hopp test hoppscotch-collection.json -e hoppscotch-env.json